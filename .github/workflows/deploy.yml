name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Auto Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 145.223.108.224
          username: u660474867
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 65002
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            if [ -d "domains/lifesolution.co.id/public_html" ]; then
              cd domains/lifesolution.co.id/public_html
            elif [ -d "domains/listech.id/public_html" ]; then
              cd domains/listech.id/public_html
            else
              cd public_html
            fi
            git pull origin main
            
            # Bersihkan duplikat CSP dari .htaccess jika ada agar dikontrol tunggal oleh next.config.js
            if [ -f ".htaccess" ]; then
              sed -i '/Content-Security-Policy/d' .htaccess
            fi
            
            npm install
            npx prisma generate
            rm -rf .next
            npm run build
            
            # Restart Hostinger Node.js App (Passenger)
            mkdir -p tmp
            touch tmp/restart.txt
