    steps:
      - name: SSH Auto Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 145.223.108.224
          username: u660474867
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 65002
          script: |
            export NVM_DIR="$HOME/.nvm"
